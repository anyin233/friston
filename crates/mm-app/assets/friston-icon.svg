<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Friston</title>
  <!-- macOS icon grid: 824px squircle-ish tile centred in a 1024px canvas. -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="#1d1c24"/>
  <ellipse cx="512" cy="852" rx="300" ry="26" fill="#14131a"/>

  <!-- Back ball wheel, behind everything. -->
  <circle cx="712" cy="772" r="66" fill="#34333c"/>
  <path d="M664 760a52 52 0 0 1 60-44" stroke="#4a4953" stroke-width="14" stroke-linecap="round" fill="none"/>

  <!-- Side battery cylinder with checker band. -->
  <rect x="770" y="352" width="66" height="214" rx="22" fill="#2b2a32"/>
  <rect x="770" y="352" width="22" height="214" rx="11" fill="#38373f"/>
  <g fill="#e8e4dc">
    <rect x="770" y="488" width="16.5" height="16"/><rect x="803" y="488" width="16.5" height="16"/>
    <rect x="786.5" y="504" width="16.5" height="16"/><rect x="819.5" y="504" width="16.5" height="16"/>
  </g>

  <!-- Neck. -->
  <rect x="380" y="640" width="270" height="60" rx="16" fill="#2b2a32"/>

  <!-- Body shell: two flat tones stand in for the render's lighting. -->
