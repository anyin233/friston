  <path d="M398 364l8 30M448 358v36M498 364l-8 30" stroke="#f6f1e8" stroke-width="11" stroke-linecap="round"/>
  <ellipse cx="350" cy="568" rx="24" ry="14" fill="#f2a3a0" opacity="0.85"/>
  <ellipse cx="548" cy="568" rx="24" ry="14" fill="#f2a3a0" opacity="0.85"/>

