  <path d="M600 292h78a72 72 0 0 1 72 72v228a72 72 0 0 1-72 72h-78z" fill="#87897b"/>
  <rect x="660" y="420" width="64" height="14" rx="7" fill="#6e7064"/>
  <rect x="660" y="448" width="64" height="14" rx="7" fill="#6e7064"/>
  <rect x="660" y="476" width="64" height="14" rx="7" fill="#6e7064"/>
  <circle cx="692" cy="574" r="17" fill="#f2efe8"/>
  <path d="M692 557a17 17 0 0 1 17 17h-17zM692 591a17 17 0 0 1-17-17h17z" fill="#e8662c"/>

