  <rect x="276" y="330" width="22" height="300" rx="11" fill="#e8662c"/>
  <rect x="300" y="330" width="296" height="300" rx="54" fill="#3b1d23"/>
  <path d="M354 330h188a54 54 0 0 1 54 54v20H300v-20a54 54 0 0 1 54-54z" fill="#4a2730"/>
  <rect x="480" y="352" width="84" height="14" rx="7" fill="#6a3a44"/>

  <!-- Face: glowing eye, the white doodle mark, and chibi blush. -->
  <circle cx="448" cy="492" r="92" fill="#ff3d3d" opacity="0.18"/>
  <circle cx="448" cy="492" r="62" fill="#ff3d3d"/>
  <circle cx="448" cy="492" r="30" fill="none" stroke="#ffe9e2" stroke-width="10"/>
  <circle cx="428" cy="468" r="11" fill="#fff6f2"/>
  <path d="M374 476c-4 48 12 92 74 92s78-44 74-92" fill="none" stroke="#f6f1e8" stroke-width="12" stroke-linecap="round"/>
