  <rect x="200" y="232" width="146" height="40" rx="20" fill="#6b6d63"/>
  <rect x="284" y="244" width="40" height="18" rx="6" fill="#ffe3a3"/>
  <circle cx="250" cy="300" r="24" fill="#1d1c24"/>
  <circle cx="250" cy="300" r="24" fill="none" stroke="#cfcfc3" stroke-width="7"/>

  <!-- Front grille panel. -->
  <rect x="352" y="684" width="250" height="132" rx="26" fill="#2f2e36"/>
  <g fill="none" stroke="#4b4a54" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
