<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const NS = 'http://www.w3.org/2000/svg';
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const S = { s1: css('--s1'), s2: css('--s2'), s3: css('--s3'), s4: css('--s4'), s5: css('--s5'), ink3: css('--ink-3'), rule: css('--rule'), rule2: css('--rule-2'), accent: css('--accent'), ink: css('--ink') };

  /** Deterministic PRNG so every render of the prototype looks the same. */
  function rng(seed) { let s = seed >>> 0 || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
  /** Creates an SVG element with attributes. */
  function el(tag, attrs = {}, parent) {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (parent) parent.appendChild(n);
    return n;
  }
  function text(parent, x, y, str, attrs = {}) {
    const t = el('text', { x, y, 'font-family': '-apple-system, PingFang SC, sans-serif', 'font-size': 10, fill: S.ink, ...attrs }, parent);
    t.textContent = str;
    return t;
  }

  /* ---------------- Fit the 1440×900 window into the viewport ---------------- */
  const scaler = $('#scaler');
  let scale = 1;
  function fit() {
    scale = Math.min((innerWidth - 32) / 1440, (innerHeight - 40 - 16) / 1000, 1);
    scaler.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }
  addEventListener('resize', fit);
  fit();

  /* ---------------- Navigation ---------------- */
  const win = $('#win');
  const overlay = $('#overlay');
  const ovToggle = $('#ovToggle');
  let current = 'live';
  function go(name) {
    current = name;
    win.dataset.screen = name;
    $$('.screen').forEach(s => s.classList.toggle('active', s.id === 's-' + name));
    $$('.sidebar [data-go]').forEach(b => {
      if (b.dataset.go === name && !b.hasAttribute('data-secondary')) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
    $$('.proto [data-go]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.go === name)));
    const live = name === 'live';
    win.dataset.recording = String(live);
    $('#liveBadge').hidden = !live;
    $('#engineText').textContent = live ? '字幕引擎运行中' : '字幕引擎就绪';
    overlay.classList.toggle('show', live && ovToggle.getAttribute('aria-pressed') === 'true');
    $('#annoText').textContent = $('#s-' + name).dataset.gpui || '';
    history.replaceState(null, '', '#' + name);
  }
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-go]');
    if (t) { e.preventDefault(); go(t.dataset.go); }
  });
  ovToggle.addEventListener('click', () => {
    const on = ovToggle.getAttribute('aria-pressed') !== 'true';
    ovToggle.setAttribute('aria-pressed', String(on));
    overlay.classList.toggle('show', on && current === 'live');
  });
  $('#annoToggle').addEventListener('change', e => $('#anno').classList.toggle('show', e.target.checked));

  /* ---------------- Floating caption window: drag ---------------- */
  overlay.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    const rect = overlay.getBoundingClientRect(), host = scaler.getBoundingClientRect();
    const dx = e.clientX - rect.left, dy = e.clientY - rect.top;
    overlay.setPointerCapture(e.pointerId);
    overlay.style.cursor = 'grabbing';
    const move = ev => {
      overlay.style.transform = 'none';
      overlay.style.left = (ev.clientX - host.left - dx) / scale + 'px';
      overlay.style.top = (ev.clientY - host.top - dy) / scale + 'px';
      overlay.style.bottom = 'auto';
    };
    const up = () => { overlay.removeEventListener('pointermove', move); overlay.style.cursor = ''; };
    overlay.addEventListener('pointermove', move);
    overlay.addEventListener('pointerup', up, { once: true });
  });

  /* ---------------- Week grid ---------------- */
  const H0 = 8, H1 = 22, ROW = 52;
  const hours = $('#hours');
  for (let h = H0; h < H1; h++) { const d = document.createElement('div'); d.textContent = h + ':00'; hours.appendChild(d); }
  const events = [
    [0, 10, 11, '产品周会', 'work done'], [0, 15, 16, '客户访谈：华南区', 'work done'],
    [1, 10.5, 11.5, '设计评审', 'work done'], [1, 14, 15, '候选人面试', 'work done'],
    [2, 9.5, 10, '站会', 'work done'], [2, 16, 17, '架构评审复盘', 'work done'],
    [3, 10, 11, '产品周会', 'work done'], [3, 14, 15, 'Q3 预算评审', 'work sel', true], [3, 16.5, 17, '与李娜 1:1', 'work'], [3, 19.5, 21, '读书会', 'personal'],
    [4, 11, 12, '季度 OKR 复盘', 'work'], [4, 15, 15.5, '供应商电话', 'work'],
    [5, 10, 12, '羽毛球', 'personal'],
  ];
  const fmt = t => `${Math.floor(t)}:${t % 1 ? '30' : '00'}`;
  for (let d = 0; d < 7; d++) {
    const col = document.createElement('div');
    col.className = 'daycol' + (d === 3 ? ' today-col' : '');
    col.style.height = (H1 - H0) * ROW + 'px';
    for (const [day, a, b, title, cls, rec] of events.filter(e => e[0] === d)) {
      const ev = document.createElement('div');
      ev.className = 'ev ' + cls;
      ev.style.top = (a - H0) * ROW + 2 + 'px';
      ev.style.height = (b - a) * ROW - 4 + 'px';
      ev.innerHTML = `<b style="font-weight:600">${title}</b><small class="num">${fmt(a)}–${fmt(b)}</small>` +
        (rec ? '<small class="rec-flag"><svg class="i sm" style="width:11px;height:11px"><use href="#i-mic"/></svg>将自动记录</small>' : '');
      col.appendChild(ev);
    }
    if (d === 3) { const now = document.createElement('div'); now.className = 'now-line'; now.style.top = (13 + 52 / 60 - H0) * ROW + 'px'; col.appendChild(now); }
    $('#weekGrid').appendChild(col);
  }

  /* ---------------- Seating map (front half-plane of a 2-channel array) ---------------- */
  (function room() {
    const svg = $('#room'), cx = 140, cy = 158, R = 120;
    const pt = (deg, r) => [cx + r * Math.sin(deg * Math.PI / 180), cy - r * Math.cos(deg * Math.PI / 180)];
    el('path', { d: `M ${cx - R} ${cy} A ${R} ${R} 0 0 1 ${cx + R} ${cy} Z`, fill: '#F1F3F8', stroke: S.rule2 }, svg);
    for (const a of [-60, -30, 0, 30, 60]) { const [x, y] = pt(a, R); el('line', { x1: cx, y1: cy, x2: x, y2: y, stroke: S.rule2, 'stroke-dasharray': '2 4' }, svg); }
    text(svg, 6, cy + 12, '左', { fill: S.ink3, 'font-size': 10 });
    text(svg, 266, cy + 12, '右', { fill: S.ink3, 'font-size': 10 });
    text(svg, cx - 10, 12, '正前', { fill: S.ink3, 'font-size': 10 });
    const people = [
      { name: '王伟', init: '王', deg: -52, c: S.s1, active: true },
      { name: '李娜', init: '李', deg: 22, c: S.s2 },
      { name: '说话人 4', init: '4', deg: 64, c: S.ink3 },
    ];
    const active = people.find(p => p.active);
    const [ax1, ay1] = pt(active.deg - 9, R), [ax2, ay2] = pt(active.deg + 9, R);
    el('path', { d: `M ${cx} ${cy} L ${ax1} ${ay1} A ${R} ${R} 0 0 1 ${ax2} ${ay2} Z`, fill: active.c, 'fill-opacity': .16 }, svg);
    const r = rng(11);
    for (const p of people) {
      for (let i = 0; i < 18; i++) {
        const g = (r() + r() + r() - 1.5) * 9;
        const [x, y] = pt(p.deg + g, 62 + r() * 46);
        el('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: 1.7, fill: p.c, 'fill-opacity': .45 }, svg);
      }
    }
    for (const p of people) {
      const [x, y] = pt(p.deg, 100);
      if (p.active) el('circle', { cx: x, cy: y, r: 16, fill: 'none', stroke: p.c, 'stroke-opacity': .35, 'stroke-width': 2 }, svg);
      el('circle', { cx: x, cy: y, r: 11, fill: p.c }, svg);
      text(svg, x, y + 3.5, p.init, { fill: '#fff', 'font-size': 10, 'font-weight': 700, 'text-anchor': 'middle' });
      // Labels sit under their marker so they never collide with neighbouring markers.
      const [lx, ly] = [x, y + 25];
      text(svg, lx, ly, p.name, { 'font-size': 10.5, 'font-weight': 600, fill: p.c === S.ink3 ? S.ink3 : S.ink, 'text-anchor': 'middle' });
    }
    el('rect', { x: cx - 13, y: cy - 7, width: 26, height: 9, rx: 4, fill: S.ink }, svg);
    el('circle', { cx: cx - 6, cy: cy - 2.5, r: 1.6, fill: '#fff' }, svg);
    el('circle', { cx: cx + 6, cy: cy - 2.5, r: 1.6, fill: '#fff' }, svg);
    el('circle', { cx: cx, cy: cy - 22, r: 9, fill: S.s5 }, svg);
    text(svg, cx, cy - 18.5, '我', { fill: '#fff', 'font-size': 9.5, 'font-weight': 700, 'text-anchor': 'middle' });
  })();

  /* ---------------- Waveforms ---------------- */
  function wave(svg, seed, hl, color = S.accent) {
    const w = +svg.getAttribute('width') || 440, h = +svg.getAttribute('height') || 34, r = rng(seed);
    const [a, b] = hl || [-1, -1];
    for (let x = 0, i = 0; x < w; x += 4, i++) {
      const env = 0.35 + 0.65 * Math.abs(Math.sin(i / 9)) * (0.6 + 0.4 * Math.sin(i / 37));
      const bh = Math.max(2, env * r() * h * 0.95);
      const on = x / w >= a && x / w <= b;
      el('rect', { x, y: (h - bh) / 2, width: 2, height: bh, rx: 1, fill: on ? color : S.rule2 }, svg);
    }
  }
  $$('svg.wave').forEach(s => wave(s, +s.dataset.wave, (s.dataset.hl || '').split(',').map(Number)));

  /* ---------------- Whiteboard + keyframe thumbnails ---------------- */
  function whiteboard(svg) {
    el('rect', { width: 240, height: 135, fill: '#F7F8FA' }, svg);
    const pen = { fill: 'none', stroke: '#2B2F57', 'stroke-width': 1.6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };
    el('rect', { x: 16, y: 52, width: 62, height: 30, rx: 4, ...pen, transform: 'rotate(-1.5 47 67)' }, svg);
    text(svg, 22, 71, '推理集群', { 'font-size': 11, fill: '#2B2F57' });
    el('path', { d: 'M 80 62 C 100 50 112 40 132 36', ...pen }, svg);
    el('path', { d: 'M 80 74 C 100 86 112 96 132 100', ...pen }, svg);
    el('rect', { x: 134, y: 22, width: 86, height: 28, rx: 4, ...pen, stroke: S.s1, transform: 'rotate(1 177 36)' }, svg);
    text(svg, 140, 40, '1期 A100 租赁', { 'font-size': 10.5, fill: S.s1, 'font-weight': 600 });
    el('rect', { x: 134, y: 88, width: 86, height: 28, rx: 4, ...pen, transform: 'rotate(-1 177 102)' }, svg);
    text(svg, 140, 106, '2期 新机房迁移', { 'font-size': 10.5, fill: '#2B2F57' });
    text(svg, 18, 112, '夜间批处理 −50%', { 'font-size': 10.5, fill: '#3F6FD8', 'font-weight': 600, transform: 'rotate(-3 18 112)' });
    text(svg, 18, 26, '扩容 2 期', { 'font-size': 12, fill: '#2B2F57', 'font-weight': 700 });
  }
  whiteboard($('#wbThumb'));
  whiteboard($('#wbBig'));
  function sheet(svg, seed, hlRow) {
    const r = rng(seed);
    el('rect', { width: 160, height: 90, fill: '#fff' }, svg);
    el('rect', { width: 160, height: 12, fill: '#EEF1F6' }, svg);
    for (let row = 0; row < 7; row++) for (let col = 0; col < 4; col++) {
      const x = 6 + col * 38, y = 18 + row * 10;
      el('rect', { x, y, width: 8 + r() * 24, height: 4, rx: 1, fill: row === hlRow ? S.accent : S.rule2 }, svg);
    }
  }
  const frames = $('#frames');
  for (let i = 0; i < 4; i++) {
    const s = el('svg', { width: 112, height: 63, viewBox: '0 0 160 90' }, frames);
    sheet(s, 30 + i, i === 2 ? 4 : -1);
  }
  const gallery = $('#gallery');
  const shots = [['23:10', 'wb'], ['12:51', 'sheet'], ['24:02', 'sheet2'], ['31:00', 'sheet3'], ['40:15', 'sheet4'], ['52:30', 'wb']];
  for (const [t, kind] of shots) {
    const f = document.createElement('figure');
    const s = el('svg', { viewBox: kind === 'wb' ? '0 0 240 135' : '0 0 160 90' });
    kind === 'wb' ? whiteboard(s) : sheet(s, t.length * 7 + t.charCodeAt(1), 3);
    f.appendChild(s);
    const cap = document.createElement('figcaption'); cap.className = 'num'; cap.textContent = t; f.appendChild(cap);
    gallery.appendChild(f);
  }

  /* ---------------- Speaker timeline (minutes detail) ---------------- */
  (function timeline() {
    const svg = $('#timeline');
    const lanes = [['王伟', S.s1, 0.30], ['Alex Chen', S.s3, 0.26], ['李娜', S.s2, 0.18], ['赵磊', S.s4, 0.10], ['我', S.s5, 0.12]];
    const x0 = 64, x1 = 354, total = 58, laneH = 14, gap = 9, top = 6;
    const X = m => x0 + (x1 - x0) * m / total;
    lanes.forEach(([name, c, share], i) => {
      const y = top + i * (laneH + gap);
      text(svg, 0, y + 10.5, name, { 'font-size': 11, fill: S.ink });
      el('rect', { x: x0, y, width: x1 - x0, height: laneH, rx: 3, fill: '#F1F3F8' }, svg);
      const r = rng(100 + i);
      for (let m = 0; m < total;) {
        const len = 0.3 + r() * 2.2;
        if (r() < share * 1.6) el('rect', { x: X(m).toFixed(1), y, width: Math.max(1.5, X(m + len) - X(m)).toFixed(1), height: laneH, rx: 2, fill: c }, svg);
        m += len + r() * 1.4;
      }
    });
    const axisY = top + lanes.length * (laneH + gap) + 4;
    for (const m of [0, 15, 30, 45]) text(svg, X(m) - 3, axisY + 10, String(m), { 'font-size': 9.5, fill: S.ink3 });
    text(svg, x1 - 18, axisY + 10, '分钟', { 'font-size': 9.5, fill: S.ink3 });
    const ph = X(23 + 10 / 60);
    el('line', { x1: ph, y1: 0, x2: ph, y2: axisY, stroke: S.ink, 'stroke-width': 1.5 }, svg);
    el('circle', { cx: ph, cy: 2, r: 3, fill: S.ink }, svg);
  })();

  /* ---------------- Clip trimming waveform with diarization lane ---------------- */
  (function clip() {
    const svg = $('#clipWave'), W = 860, r = rng(77);
    // Axis spans 12:00–13:40 (100 s); 0.40–0.65 is 12:40–13:05 = 25 s, matching the label.
    const sel = [0.40, 0.65];
    el('rect', { x: W * sel[0], y: 0, width: W * (sel[1] - sel[0]), height: 92, fill: S.accent, 'fill-opacity': .08 }, svg);
    for (let x = 0, i = 0; x < W; x += 4, i++) {
      const env = 0.25 + 0.75 * Math.abs(Math.sin(i / 11)) * (0.55 + 0.45 * Math.sin(i / 41));
      const bh = Math.max(2, env * r() * 54);
      const on = x / W >= sel[0] && x / W <= sel[1];
      el('rect', { x, y: 30 - bh / 2, width: 2, height: bh, rx: 1, fill: on ? S.s1 : S.rule2 }, svg);
    }
    const segs = [[0, .12, S.s2], [.12, .21, S.s3], [.21, .38, S.s1], [.38, .40, S.ink3], [.40, .66, S.s1], [.66, .74, S.s2], [.74, .84, S.s5], [.84, 1, S.s1]];
    for (const [a, b, c] of segs) el('rect', { x: W * a + 1, y: 64, width: W * (b - a) - 2, height: 8, rx: 2, fill: c }, svg);
    for (const s of sel) {
      el('line', { x1: W * s, y1: 0, x2: W * s, y2: 76, stroke: S.accent, 'stroke-width': 2 }, svg);
      el('rect', { x: W * s - 4, y: 26, width: 8, height: 10, rx: 2, fill: S.accent }, svg);
    }
    const labels = ['12:00', '12:20', '12:40', '13:00', '13:20', '13:40'];
    labels.forEach((l, i) => text(svg, (W / (labels.length - 1)) * i - (i === labels.length - 1 ? 28 : 0), 88, l, { 'font-size': 10, fill: S.ink3 }));
  })();

  /* ---------------- Live motion: meters, timer, streaming partial ---------------- */
  $$('[data-meter]').forEach(m => { for (let i = 0; i < 8; i++) m.appendChild(document.createElement('i')); });
  if (!reduceMotion) {
    const r = rng(5);
    setInterval(() => $$('[data-meter]').forEach(m => [...m.children].forEach((b, i) => {
      const v = Math.min(1, (0.15 + r() * 0.85) * (1 - i * 0.07));
      b.style.height = Math.round(v * 100) + '%';
      b.classList.toggle('hot', v > 0.9);
    })), 130);

    let secs = 41 * 60 + 52;
    setInterval(() => {
      secs++;
      const mm = String(Math.floor(secs / 60)).padStart(2, '0'), ss = String(secs % 60).padStart(2, '0');
      $('#recTimer').textContent = `录制中 00:${mm}:${ss}`;
    }, 1000);

    const base = '好，那就定在下周三之前，我这边先出一版';
    const tail = '分团队的明细，周五前发给大家。';
    let k = 0;
    setInterval(() => {
      k = (k + 1) % (tail.length + 8);
      const t = base + tail.slice(0, Math.min(k, tail.length));
      $('#partialText').textContent = t;
      $('#ovText').textContent = t;
    }, 260);
  }

  go((location.hash || '#live').slice(1));
})();
</script>
</body>
</html>
