  <circle cx="290" cy="814" r="8" fill="#26252c"/>
  <circle cx="632" cy="814" r="52" fill="#26252c"/>
  <circle cx="632" cy="814" r="22" fill="#cfcfc3"/>
  <circle cx="632" cy="814" r="8" fill="#26252c"/>
</svg>
