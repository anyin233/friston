<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting Master 界面原型 v0.1</title>
<style>
/* ------------------------------------------------------------------
   Tokens. Mirrors the GPUI Kit theme we will register (ThemeColor).
   Speaker hues are identity: one person keeps one hue on every surface.
   ------------------------------------------------------------------ */
:root {
  --paper: #F4F6FA;      /* window background */
  --panel: #FFFFFF;      /* documents, inputs */
  --sunken: #ECEFF5;     /* sidebar, wells */
  --ink: #171A33;
  --ink-2: #4A4F6E;
  --ink-3: #8A8FA8;
  --rule: #E2E5EE;
  --rule-2: #CFD4E2;
  --accent: #3640D8;
  --accent-ink: #2A31B0;
  --accent-soft: #ECEEFF;
  --rec: #E5484D;        /* recording state only */
  --ok: #1F9D6B;
  --warn: #B87414;
  --stage: #141634;      /* caption stage + overlay */
  --stage-2: #1D2148;
  --stage-ink: #ECEEFF;
  --stage-dim: #9DA3D6;
  --s1: #22A39A; --s2: #E3922A; --s3: #9B6BF2; --s4: #EF5D78; --s5: #3F8EF0; --s6: #7FB449;
  --ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  --doc: ui-serif, Georgia, "Songti SC", "Noto Serif SC", serif;
  --r-window: 12px; --r-control: 6px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 13px/1.45 var(--ui); color: var(--ink); background: #D5D9E4;
  -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 0;
}
button, input, select { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.i.sm { width: 14px; height: 14px; }
.i.lg { width: 18px; height: 18px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
a { color: var(--accent-ink); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }

/* ---------------- Prototype chrome (not part of the product) ---------------- */
.proto {
  position: fixed; top: 0; left: 0; right: 0; height: 40px; z-index: 20;
  display: flex; align-items: center; gap: 4px; padding: 0 16px;
  background: rgba(244,246,250,.92); border-bottom: 1px solid var(--rule-2); font-size: 12px; color: var(--ink-2);
}
.proto strong { color: var(--ink); margin-right: 12px; font-weight: 600; }
.proto button { border: 0; background: none; padding: 4px 9px; border-radius: 5px; cursor: pointer; color: var(--ink-2); }
.proto button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.proto .spacer { flex: 1; }
.proto label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.desk { position: fixed; inset: 40px 0 0 0; overflow: hidden; }
/* 1440×900 window plus room below it, where the floating caption window can sit over the "desktop". */
/* Centred absolutely: grid centring falls back to start alignment when the item overflows. */
.scaler { width: 1440px; height: 1000px; position: absolute; left: 50%; top: 50%; transform-origin: center center; }

/* ---------------- Window ---------------- */
.window {
  width: 1440px; height: 900px; border-radius: var(--r-window); overflow: hidden; background: var(--paper);
  display: flex; flex-direction: column;
  box-shadow: 0 0 0 .5px rgba(23,26,51,.28), 0 28px 70px -18px rgba(23,26,51,.45);
}
.titlebar {
  height: 44px; flex: none; display: grid; grid-template-columns: 216px 1fr auto; align-items: center;
  border-bottom: 1px solid var(--rule); background: var(--paper);
}
.lights { display: flex; gap: 8px; padding-left: 14px; align-items: center; }
.lights span { width: 12px; height: 12px; border-radius: 50%; background: #FF5F57; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.15); }
.lights span:nth-child(2) { background: #FEBC2E; } .lights span:nth-child(3) { background: #28C840; }
.lights .i { margin-left: 18px; color: var(--ink-3); }
.cmd {
  justify-self: center; width: 440px; height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 10px;
  border-radius: var(--r-control); background: var(--sunken); color: var(--ink-3); font-size: 12.5px;
}
.cmd kbd { margin-left: auto; font: 11px var(--ui); color: var(--ink-3); }
.tb-right { display: flex; align-items: center; gap: 14px; padding-right: 14px; font-size: 12px; color: var(--ink-2); }
.rec { display: none; align-items: center; gap: 7px; color: var(--rec); font-weight: 600; }
.rec::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--rec); animation: pulse 1.6s ease-in-out infinite; }
.window[data-recording="true"] .rec { display: flex; }
.tb-status { display: flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.dot.idle { background: var(--ink-3); } .dot.busy { background: var(--warn); }
@keyframes pulse { 50% { opacity: .35; } }

.body { flex: 1; min-height: 0; display: flex; }
.sidebar {
  width: 216px; flex: none; background: var(--sunken); border-right: 1px solid var(--rule);
  display: flex; flex-direction: column; padding: 10px 8px;
}
.nav-group { font-size: 11.5px; color: var(--ink-3); padding: 8px 10px 4px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: var(--r-control);
  color: var(--ink-2); cursor: pointer; border: 0; background: none; width: 100%; text-align: left;
}
.nav-item:hover { background: rgba(23,26,51,.05); }
.nav-item[aria-current="page"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--rule); }
.nav-item .count { margin-left: auto; font-size: 11.5px; color: var(--ink-3); }
.nav-item .live-badge { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--rec); }
.side-foot { margin-top: 6px; padding: 10px; display: grid; gap: 7px; font-size: 11.5px; color: var(--ink-2); border-top: 1px solid var(--rule); }
.side-foot div { display: flex; align-items: center; gap: 7px; }

main { flex: 1; min-width: 0; position: relative; }
.screen { position: absolute; inset: 0; display: none; }
.screen.active { display: flex; }

/* ---------------- Shared parts ---------------- */
.page-head h1 { font-size: 26px; line-height: 1.2; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.page-head .sub { margin: 6px 0 0; color: var(--ink-2); font-size: 13.5px; }
.h2 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -.005em; }
.section-title { font-size: 13px; font-weight: 600; margin: 0 0 10px; color: var(--ink); }
.muted { color: var(--ink-3); }
.btn {
  height: 30px; padding: 0 12px; border-radius: var(--r-control); border: 1px solid var(--rule-2); background: var(--panel);
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12.5px; white-space: nowrap;
}
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: rgba(23,26,51,.06); }
.btn.danger { color: var(--rec); border-color: rgba(229,72,77,.45); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 4px; font-size: 11.5px; background: var(--sunken); color: var(--ink-2); white-space: nowrap; }
.tag.ok { background: #E3F4EC; color: #17724F; }
.tag.busy { background: #FBF0DE; color: #8A570E; }
.tag.accent { background: var(--accent-soft); color: var(--accent-ink); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--rule); border-radius: var(--r-control); background: var(--panel); font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.chip strong { color: var(--ink); font-weight: 500; }
/* Speaker identity: a pill in the speaker's hue. The only pill shape in the system. */
.who { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px 0 6px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); white-space: nowrap; }
.who::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.who.unknown { --c: var(--ink-3); }
.av { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11.5px; font-weight: 600; color: #fff; background: var(--c); flex: none; }
.av.pending { background: var(--panel); color: var(--ink-2); box-shadow: inset 0 0 0 1.5px var(--rule-2); border: 1.5px dashed transparent; }
.av-stack { display: flex; }
.av-stack .av { box-shadow: 0 0 0 2px var(--paper); }
.av-stack .av + .av { margin-left: -6px; }
.c1 { --c: var(--s1); } .c2 { --c: var(--s2); } .c3 { --c: var(--s3); } .c4 { --c: var(--s4); } .c5 { --c: var(--s5); } .c6 { --c: var(--s6); }
.split-v { width: 1px; background: var(--rule); flex: none; }
.scroll { overflow: auto; }
.seg { display: inline-flex; padding: 2px; border-radius: 7px; background: var(--sunken); gap: 2px; }
.seg button { border: 0; background: none; height: 26px; padding: 0 11px; border-radius: 5px; font-size: 12.5px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--rule); }
.check { width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--rule-2); flex: none; display: grid; place-items: center; background: var(--panel); }
.check.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.meter { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
.meter i { width: 3px; border-radius: 1px; background: var(--ok); height: 30%; transition: height .12s linear; }
.meter i.hot { background: var(--warn); }
.kbd { font-size: 11px; color: var(--ink-3); border: 1px solid var(--rule-2); border-radius: 4px; padding: 0 4px; }

/* ---------------- 今天 Today ---------------- */
.today { display: flex; width: 100%; }
.today-main { flex: 1; min-width: 0; padding: 30px 40px; overflow: auto; }
.next { margin: 26px 0 34px; border: 1px solid var(--rule); border-radius: 10px; background: var(--panel); }
.next-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; padding: 20px 22px 16px; }
.next-when { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 12.5px; margin-bottom: 6px; }
.next-when .soon { color: var(--accent-ink); font-weight: 600; }
.next h2 { font-size: 24px; margin: 0; font-weight: 600; letter-spacing: -.01em; }
.next-actions { display: flex; gap: 8px; }
.next-people { display: flex; align-items: center; gap: 14px; padding: 0 22px 16px; color: var(--ink-2); }
.next-people p { margin: 0; }
.preset { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 12px 22px; border-top: 1px solid var(--rule); background: #FAFBFD; border-radius: 0 0 10px 10px; }
.preset-label { color: var(--ink-3); font-size: 12px; margin-right: 4px; }
.dayline { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--rule-2); margin-left: 52px; }
.dayline li { position: relative; padding: 0 0 22px 22px; }
.dayline time { position: absolute; left: -64px; top: 1px; width: 48px; text-align: right; color: var(--ink-3); font-size: 12.5px; }
.dayline li::before { content: ""; position: absolute; left: -5px; top: 5px; width: 9px; height: 9px; border-radius: 50%; background: var(--paper); box-shadow: inset 0 0 0 2px var(--rule-2); }
.dayline li.done::before { background: var(--ink-3); box-shadow: none; }
.dayline li.upnext::before { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.dayline .t { font-size: 14px; font-weight: 500; }
.dayline .m { display: flex; gap: 8px; align-items: center; margin-top: 4px; color: var(--ink-2); font-size: 12.5px; }
.today-rail { width: 360px; flex: none; border-left: 1px solid var(--rule); padding: 30px 24px; display: flex; flex-direction: column; gap: 30px; overflow: auto; }
.mlist { list-style: none; margin: 0; padding: 0; }
.mlist li { padding: 11px 0; border-bottom: 1px solid var(--rule); cursor: pointer; }
.mlist li:first-child { padding-top: 0; }
.mlist .t { font-weight: 500; font-size: 13.5px; }
.mlist .m { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; color: var(--ink-3); font-size: 12px; }
.todo { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.todo li { display: flex; gap: 10px; align-items: flex-start; }
.todo .src { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.rail-foot { margin-top: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }

/* ---------------- 日程 Schedule ---------------- */
.sched { display: flex; width: 100%; }
.week { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.week-head { display: flex; align-items: center; gap: 12px; padding: 18px 24px 14px; border-bottom: 1px solid var(--rule); }
.week-head .h2 { margin-right: auto; }
.week-days { display: grid; grid-template-columns: 52px repeat(7, 1fr); border-bottom: 1px solid var(--rule); }
.week-days div { padding: 8px 10px; font-size: 12px; color: var(--ink-2); }
.week-days b { display: block; font-size: 18px; font-weight: 500; color: var(--ink); }
.week-days .today-col b { color: var(--accent); }
.week-grid { flex: 1; overflow: auto; position: relative; display: grid; grid-template-columns: 52px repeat(7, 1fr); }
.hours div { height: 52px; font-size: 11px; color: var(--ink-3); text-align: right; padding-right: 8px; transform: translateY(-7px); }
.daycol { position: relative; border-left: 1px solid var(--rule); background: repeating-linear-gradient(to bottom, transparent 0 51px, var(--rule) 51px 52px); }
.daycol.today-col { background-color: rgba(54,64,216,.025); }
.ev { position: absolute; left: 4px; right: 4px; border-radius: 5px; padding: 5px 7px; font-size: 11.5px; line-height: 1.3; overflow: hidden; cursor: pointer;
      background: #E9ECF8; color: var(--ink); border-left: 3px solid #8E95C9; }
.ev small { display: block; color: var(--ink-2); }
.ev.work { background: #E7E9FD; border-left-color: var(--accent); }
.ev.personal { background: #E6F3EF; border-left-color: #48A383; }
.ev.done { opacity: .62; }
.ev.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.ev .rec-flag { display: inline-flex; align-items: center; gap: 3px; color: var(--accent-ink); font-weight: 600; }
.now-line { position: absolute; left: 0; right: 0; height: 0; border-top: 1.5px solid var(--rec); z-index: 2; }
.now-line::before { content: ""; position: absolute; left: -4px; top: -4.5px; width: 7px; height: 7px; border-radius: 50%; background: var(--rec); }
.ev-panel { width: 360px; flex: none; border-left: 1px solid var(--rule); padding: 22px 24px; overflow: auto; display: flex; flex-direction: column; gap: 20px; }
.kv { display: grid; grid-template-columns: 72px 1fr; gap: 8px 12px; font-size: 12.5px; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; }
.people-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.people-list li { display: flex; align-items: center; gap: 10px; }
.people-list .state { margin-left: auto; font-size: 11.5px; }
.field { display: grid; gap: 6px; }
.field > span { font-size: 12px; color: var(--ink-3); }
.select { height: 30px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border: 1px solid var(--rule-2); border-radius: var(--r-control); background: var(--panel); font-size: 12.5px; }
.prenote { border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; font-family: var(--doc); font-size: 14px; line-height: 1.75; background: var(--panel); min-height: 120px; color: var(--ink); }
.prenote li { margin: 2px 0; }
</style>
</head>
